name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: npm install --no-audit --no-fund
      - run: bun test
      - run: npx --yes tsx --test packages/cose-hpke/test/draft27.test.node.ts
      - run: npx tsc --noEmit
